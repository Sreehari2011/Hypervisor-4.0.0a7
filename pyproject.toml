[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypervisor"
version = "4.0.0a5"
description = "AEGIS Hypervisor 4.0 — single-loop VAPT agent platform (clean-room rebuild; Claude-Code-shaped control plane)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AEGIS Platform Team" }]
# P0 discipline: stdlib-only at runtime, with ONE declared exception —
# the P1 adapter's OpenAI-compatible transport (httpx, imported lazily
# at call time inside OpenAICompatClient._http). Test-4's clean
# engagement container caught the declaration gap when the first model
# call died inside _http(); the debug kit's httpx/requests patches stay
# optional guarded imports.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hypervisor = "hypervisor.cli:main"

[tool.setuptools]
packages = [
    "hypervisor",
    "hypervisor.tools",
    "hypervisor.agents",
    "hypervisor.context",
    "hypervisor.memory",
    "hypervisor.persist",
    "hypervisor.debug",
    "hypervisor.adapters",
    "hypervisor.tui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
